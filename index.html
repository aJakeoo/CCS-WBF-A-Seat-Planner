<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Highest Road Screening | Reserve a seat</title>
<meta name="description" content="Reserve your seat for the screening of The Highest Road, December 3 at 7:30 PM, W.B. Ford Auditorium.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <p class="eyebrow" id="venue"></p>
  <h1 id="title"></h1>
  <p class="meta" id="meta"></p>
</header>

<main class="layout">
  <section class="map-wrap" aria-label="Seat map">
    <div class="screen" aria-hidden="true"><span>Screen</span></div>
    <div id="map" class="map"></div>
    <ul class="legend">
      <li><i class="s avail"></i>Available</li>
      <li><i class="s sel"></i>Yours</li>
      <li><i class="s taken"></i>Taken</li>
      <li><i class="s held"></i>Reserved</li>
    </ul>
    <p class="note">Seat layout is approximate.</p>
  </section>

  <aside class="panel" aria-label="Your reservation">
    <h2>Your seats</h2>
    <div class="party">
      <span>Party size</span>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Fewer seats">&minus;</button>
        <output id="partyOut">2</output>
        <button type="button" id="plus" aria-label="More seats">+</button>
      </div>
    </div>
    <p class="chosen" id="chosen">No seats selected</p>
    <form id="form" novalidate>
      <label>Name<input id="name" autocomplete="name"></label>
      <label>Email<input id="email" type="email" autocomplete="email"></label>
      <p class="err" id="err" role="alert"></p>
      <button type="submit" class="primary">Reserve</button>
    </form>
    <p class="fine" id="mode"></p>
  </section>
</main>

<div id="done" class="done" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneT">
    <h2 id="doneT">You are on the list</h2>
    <p id="doneP"></p>
    <pre id="doneS" hidden></pre>
    <button type="button" class="primary" id="doneB">Close</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
